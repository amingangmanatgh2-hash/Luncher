plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.luncher.companion'
    compileSdk 34

    defaultConfig {
        applicationId "dev.luncher.companion"
        // 26 (Android 8.0) is the floor that lets the launcher icon be a pure-XML
        // adaptive icon. Below that a density-specific PNG is required, and this
        // repository deliberately ships no binary assets so the CI build cannot
        // break on a missing resource. It covers ~97% of active devices.
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.1.0"
    }

    signingConfigs {
        // Signed with the local debug key so the artifact from CI is installable
        // immediately. To publish properly, add a keystore as a repository secret
        // and see docs/android.md — an app signed with a debug key cannot be
        // updated from the Play Store.
        ci {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.ci
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true }

    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
