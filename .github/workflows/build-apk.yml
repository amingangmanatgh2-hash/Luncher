name: Build APK

on:
  push:
    branches:
      - arena/01a0ed54-luncher
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble DLCK LNCH
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan (blocks build if a credential is committed)
        run: bash scripts/secret_scan.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          else
            echo "Wrapper already present."
          fi

      - name: Unit tests
        run: bash scripts/ci_gradle.sh testDebugUnitTest

      - name: Build debug APK
        run: bash scripts/ci_gradle.sh assembleDebug

      - name: Build release APK
        run: bash scripts/ci_gradle.sh assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/debug/app-debug.apk "dist/dlck-lnch-${VERSION}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/dlck-lnch-${VERSION}-release.apk"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "--- built artifacts ---"
          ls -lh dist
          # Fail loudly if the APK is suspiciously small / missing
          test -s "dist/dlck-lnch-${VERSION}-debug.apk"

      - name: Verify no credential is baked into the APK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zipmerge >/dev/null 2>&1 || true
          echo "Scanning APK contents for Google API key patterns..."
          FOUND=0
          for apk in dist/*.apk; do
            if strings "$apk" | grep -qE 'AIza[0-9A-Za-z_-]{20,}'; then
              echo "::error::A Google API key pattern was found inside $apk"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "✓ No API key material found inside the APKs."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlck-lnch-apk
          path: dist/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'arena/01a0ed54-luncher'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-build.${RUN_NUMBER}"

          # Note: no heredoc — an indented EOF inside a YAML block scalar would never
          # terminate it. printf keeps the notes readable and safely quoted.
          printf '%s\n' \
            "Automated build of \`${COMMIT_SHA}\`." \
            "" \
            "**Install:** download \`dlck-lnch-${VERSION}-debug.apk\`, allow \"install unknown apps\", then open it." \
            "**Set as home:** Android Settings -> Apps -> Default apps -> Home app -> DLCK LNCH." \
            "" \
            "No API key is embedded in this APK. Add your own Gemini key inside the app under Settings -> AI Setup." \
            > /tmp/notes.md

          # 1. Create the release as a draft first, so a failed upload never leaves a
          #    published release with missing assets.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "DLCK LNCH ${VERSION} (build ${RUN_NUMBER})" \
              --notes-file /tmp/notes.md \
              --target "$COMMIT_SHA"
          fi

          # 2. Upload every APK, retrying transient GitHub upload failures.
          UPLOADED=0
          for attempt in 1 2 3; do
            if gh release upload "$TAG" dist/*.apk --clobber; then
              UPLOADED=1
              break
            fi
            echo "::warning::asset upload attempt ${attempt} failed, retrying in 15s"
            sleep 15
          done
          if [ "$UPLOADED" -ne 1 ]; then
            echo "::error::could not upload APKs to release $TAG"
            exit 1
          fi

          # 3. Only now make it visible, and verify the assets really are attached.
          gh release edit "$TAG" --draft=false --latest
          ASSETS=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(", ")')
          echo "Release $TAG published with: $ASSETS"
          if [ -z "$ASSETS" ]; then
            echo "::error::release $TAG has no assets"
            exit 1
          fi

      - name: Commit generated Gradle wrapper back to the branch
        if: success()
        run: |
          if [ -n "$(git status --porcelain gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
            git commit -m "build: add Gradle wrapper generated by CI [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Wrapper already committed."
          fi
